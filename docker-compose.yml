# Local Postgres for dev + adapter tests (DEC-020). One server, two logical DBs:
# muster_dev (the app) and muster_test (adapter tests, freely wiped). This is
# *local* dev infra only — the hosted provider is deferred and vendor-agnostic
# (DEC-020); the schema is plain Postgres DDL that drops onto any host.
services:
  postgres:
    image: postgres:17
    container_name: muster-postgres
    environment:
      POSTGRES_USER: muster
      POSTGRES_PASSWORD: muster
      POSTGRES_DB: muster_dev
    ports:
      - "5432:5432"
    volumes:
      - muster-pgdata:/var/lib/postgresql/data
      # Runs once on first init: creates the test database alongside muster_dev.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U muster -d muster_dev"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  muster-pgdata:
