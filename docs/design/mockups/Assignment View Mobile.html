<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Muster · Assignment (mobile)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
:root{
  --accent:#2f5d86;
  --m-bg:#eef2f6; --m-card:#ffffff;
  --m-ink:#101826; --m-muted:#5b6675; --m-faint:#93a0b0; --m-line:#e7ebf1;
  --ok:#15803d; --ok-bg:#e7f4ec; --ok-line:#cbe6d5;
  --warn:#b45309; --warn-bg:#fbf0db; --warn-line:#f0ddb4;
  --bad:#be2f2a; --bad-bg:#fbe6e4; --bad-line:#f2cdc9;
  --info:#3257a8; --info-bg:#e7ecf7; --info-line:#cdd8ee;
  --claim:#6a4fb0; --claim-bg:#ece7f6; --claim-line:#ddd2ef;
  --cap:#2f5d86; --mate:#2f7d70;
}
*{box-sizing:border-box;}
html,body{margin:0; min-height:100%;}
body{background:#dfe4ea; background-image:radial-gradient(circle at 50% 0%, #e9edf2, #d7dce3); font-family:'IBM Plex Sans',system-ui,sans-serif; display:flex; flex-direction:column; align-items:center; gap:18px; padding:34px 16px 48px; min-height:100vh;}
.mono{font-family:'IBM Plex Mono',monospace;}
.page-cap{text-align:center; color:#5b6675; font-size:13px; max-width:400px;}
.page-cap b{color:#101826;}
.page-cap a{color:var(--accent); text-decoration:none; font-weight:600;}
button{font-family:inherit; cursor:pointer;}
h1,h2,h3{margin:0;}

.am-app{position:relative; height:100%; overflow:hidden; background:var(--m-bg);}
.am-scroll{height:100%; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:54px 0 40px; color:var(--m-ink);}
.role-ic{display:inline-flex; align-items:center; justify-content:center; color:#fff; font-weight:700; border-radius:6px; width:30px; height:30px; font-size:13px; flex:none;}
.role-captain{background:var(--cap);} .role-mate{background:var(--mate);}
.boat-dot{width:9px; height:9px; border-radius:50%; display:inline-block; background:var(--m-faint);}
[data-boat="mt"]{background:var(--cap);} [data-boat="tw"]{background:var(--mate);}

/* header */
.am-head{padding:4px 16px 12px;}
.am-eyebrow{display:flex; align-items:center; gap:7px; font-size:13px; font-weight:600; color:var(--m-muted); margin-bottom:11px;}
.am-h-row{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:10px;}
.am-trips{display:flex; align-items:center; gap:7px; flex-wrap:wrap;}
.am-trip{display:inline-flex; align-items:center; gap:5px; font-size:13.5px; font-weight:600; background:#f7f9fb; border:1px solid var(--m-line); padding:4px 10px; border-radius:8px; white-space:nowrap;}
.am-trip b{font-family:'IBM Plex Mono',monospace; color:var(--accent);}
.am-pax{font-size:11.5px; color:var(--m-faint); font-family:'IBM Plex Mono',monospace;}
.am-shift-badge{font-size:12px; font-weight:700; padding:4px 11px; border-radius:20px; white-space:nowrap;}
.sb-filling{background:var(--warn-bg); color:var(--warn);}
.sb-crewed{background:var(--ok-bg); color:var(--ok);}
.sb-atrisk{background:var(--bad-bg); color:var(--bad);}
.am-fillsby{display:flex; align-items:center; justify-content:space-between; font-size:12px; color:var(--m-faint); background:#f7f9fb; border:1px solid var(--m-line); border-radius:9px; padding:7px 12px;}
.am-cd{font-family:'IBM Plex Mono',monospace; font-size:14px; color:var(--m-ink);}

/* posture */
.am-posture{display:flex; align-items:center; gap:9px; margin:0 16px 12px; padding:10px 14px; border-radius:11px; font-size:13px; border:1px solid var(--m-line);}
.am-posture b{font-weight:700; white-space:nowrap;}
.am-posture span:not(.am-pulse){color:var(--m-muted); font-size:12.5px;}
.am-posture.auto{background:var(--info-bg); border-color:var(--info-line);}
.am-posture.manual{background:var(--warn-bg); border-color:var(--warn-line);}
.am-pulse{width:9px; height:9px; border-radius:50%; background:var(--info); animation:pulse 1.8s infinite;}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(50,87,168,.45);}70%{box-shadow:0 0 0 7px rgba(50,87,168,0);}100%{box-shadow:0 0 0 0 rgba(50,87,168,0);}}
.am-resume{margin-left:auto; border:1px solid var(--warn); background:var(--warn); color:#fff; font-size:12px; font-weight:600; padding:5px 11px; border-radius:8px;}

/* seat cards */
.am-seats{padding:0 16px; display:flex; flex-direction:column; gap:11px;}
.am-seat{background:var(--m-card); border:1px solid var(--m-line); border-radius:14px; padding:14px; display:flex; flex-direction:column; gap:11px; box-shadow:0 1px 2px rgba(15,23,42,.04);}
.am-seat-confirmed{border-color:var(--ok-line);}
.am-seat-bailed{border-color:var(--bad-line);}
.am-seat-top{display:flex; align-items:center; justify-content:space-between;}
.am-seat-id{display:flex; align-items:center; gap:11px;}
.am-seat-role{font-weight:700; font-size:15px; text-transform:capitalize;}
.am-seat-proto{font-size:11.5px; color:var(--m-faint);}
.am-badge{font-size:11px; font-weight:700; padding:3px 10px; border-radius:20px;}
.ab-open{background:#eef1f5; color:#7c8696;}
.ab-asked{background:var(--info-bg); color:var(--info);}
.ab-claimed{background:var(--claim-bg); color:var(--claim);}
.ab-confirmed{background:var(--ok-bg); color:var(--ok);}
.ab-bailed{background:var(--bad-bg); color:var(--bad);}

.am-occ{border-radius:11px; padding:12px 13px; display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
.am-occ.ok{background:var(--ok-bg); border:1px solid var(--ok-line);}
.am-occ.claim{background:var(--claim-bg); border:1px solid var(--claim-line); justify-content:space-between;}
.am-occ.asked{background:var(--info-bg); border:1px solid var(--info-line); justify-content:space-between;}
.am-occ.bail{background:var(--bad-bg); border:1px solid var(--bad-line); color:#7a2620; font-size:12.5px; line-height:1.4;}
.am-occ-n{font-weight:700; font-size:14.5px; white-space:nowrap;}
.am-occ-tag{font-size:11.5px; color:var(--m-muted); margin-top:3px;}
.am-call{margin-left:auto; width:34px; height:34px; border-radius:9px; background:var(--ok); color:#fff; display:flex; align-items:center; justify-content:center; text-decoration:none; font-size:15px;}

.am-cta{border:1px solid var(--accent); background:var(--accent); color:#fff; font-size:13.5px; font-weight:600; padding:9px 15px; border-radius:10px; white-space:nowrap;}
.am-cta.wide{width:100%; padding:11px;}
.am-mini{border:1px solid var(--m-line); background:var(--m-card); color:var(--m-muted); font-size:12px; font-weight:600; padding:6px 11px; border-radius:8px; white-space:nowrap;}
.am-mini.go{border-color:var(--accent); color:var(--accent); background:var(--info-bg);}

.am-poolbtn{display:flex; align-items:center; justify-content:space-between; width:100%; border:1px dashed var(--m-line); background:#f7f9fb; color:var(--m-muted); font-size:13px; font-weight:600; padding:11px 13px; border-radius:10px;}
.am-poolstats{display:flex; gap:6px;}
.am-poolstats .ps{font-size:10.5px; font-weight:700; padding:2px 7px; border-radius:5px;}
.ps.in{background:var(--ok-bg); color:var(--ok);}
.ps.silent{background:var(--bad); color:#fff;}

.am-band{font-size:10px; font-weight:700; padding:1px 7px; border-radius:5px;}
.am-high{background:var(--ok-bg); color:var(--ok);} .am-med{background:#eef1f5; color:#51607a;} .am-low{background:#f1f3f6; color:#7c8696;}

.am-foot-note{text-align:center; color:var(--m-faint); font-size:11.5px; line-height:1.5; padding:20px 30px 0; text-wrap:pretty;}

/* pool sheet */
.am-sheet-scrim{position:absolute; inset:0; background:rgba(15,23,42,.4); display:flex; align-items:flex-end; z-index:40; animation:fade .2s;}
.am-sheet{width:100%; background:var(--m-card); border-radius:22px 22px 0 0; padding:8px 18px 26px; animation:rise .28s cubic-bezier(.32,.72,0,1); max-height:88%; overflow-y:auto;}
.am-grip{width:38px; height:5px; border-radius:10px; background:#d4dae1; margin:6px auto 12px;}
.am-sheet h3{font-size:18px; font-weight:700; text-transform:capitalize; margin-bottom:5px;}
.am-sheet-note{font-size:12px; color:var(--m-muted); margin:0 0 13px; line-height:1.45;}
.am-cand{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:11px 12px; border:1px solid var(--m-line); border-radius:11px; margin-bottom:7px;}
.am-cand.silent{background:repeating-linear-gradient(135deg,var(--bad-bg),var(--bad-bg) 6px,#fff 6px,#fff 12px); border-color:var(--bad-line);}
.am-cand-l{display:flex; align-items:center; gap:8px;}
.am-cand-n{font-weight:600; font-size:13.5px; white-space:nowrap;}
.am-cand-r{display:flex; align-items:center; gap:8px;}
.am-ask{font-size:11px; font-weight:700; padding:2px 8px; border-radius:20px;}
.ak-available{background:#eef1f5; color:#5b6675;}
.ak-asked{background:var(--info-bg); color:var(--info);}
.ak-in{background:var(--ok-bg); color:var(--ok);}
.ak-declined{background:#f1f3f6; color:#9aa3b0;}
.ak-silent{background:var(--bad); color:#fff;}
.am-excl{display:flex; align-items:center; justify-content:space-between; gap:10px; font-size:12px; color:var(--m-muted); padding:7px 12px; border-top:1px dashed var(--m-line); margin-top:4px;}
.am-excl span{color:var(--bad); font-size:11.5px;}

.am-toast{position:absolute; bottom:30px; left:50%; transform:translateX(-50%); background:var(--m-ink); color:#fff; padding:11px 17px; border-radius:11px; font-size:12.5px; font-weight:500; z-index:50; animation:fade .2s; max-width:88%; text-align:center;}
@keyframes fade{from{opacity:0;}}
@keyframes rise{from{transform:translateY(100%);}}
</style>
</head>
