<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Muster · At-Risk (mobile)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
:root{
  --accent:#2f5d86;
  --m-bg:#eef2f6; --m-card:#ffffff;
  --m-ink:#101826; --m-muted:#5b6675; --m-faint:#93a0b0; --m-line:#e7ebf1;
  --ok:#15803d; --ok-bg:#e7f4ec; --ok-line:#cbe6d5;
  --warn:#b45309; --warn-bg:#fbf0db; --warn-line:#f0ddb4;
  --bad:#be2f2a; --bad-bg:#fbe6e4; --bad-line:#f2cdc9;
  --info:#3257a8; --info-bg:#e7ecf7; --info-line:#cdd8ee;
  --cap:#2f5d86; --mate:#2f7d70;
}
*{box-sizing:border-box;}
html,body{margin:0; min-height:100%;}
body{background:#dfe4ea; background-image:radial-gradient(circle at 50% 0%, #e9edf2, #d7dce3); font-family:'IBM Plex Sans',system-ui,sans-serif; display:flex; flex-direction:column; align-items:center; gap:18px; padding:34px 16px 48px; min-height:100vh;}
.mono{font-family:'IBM Plex Mono',monospace;}
.page-cap{text-align:center; color:#5b6675; font-size:13px; max-width:400px;}
.page-cap b{color:#101826;}
.page-cap a{color:var(--accent); text-decoration:none; font-weight:600;}
button{font-family:inherit; cursor:pointer;}
h1,h2,h3{margin:0;}

.rm-app{position:relative; height:100%; overflow:hidden; background:var(--m-bg);}
.rm-scroll{height:100%; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:54px 0 40px; color:var(--m-ink);}
.role-ic{display:inline-flex; align-items:center; justify-content:center; color:#fff; font-weight:700; border-radius:5px;}
.role-ic.sm{width:17px; height:17px; font-size:10px;}
.role-captain{background:var(--cap);} .role-mate{background:var(--mate);}
.boat-dot{width:8px; height:8px; border-radius:50%; display:inline-block; background:var(--m-faint);}
[data-boat="mt"]{background:var(--cap);} [data-boat="tw"]{background:var(--mate);}

/* header */
.rm-head{padding:4px 16px 12px;}
.rm-eyebrow{font-size:11.5px; font-weight:600; letter-spacing:.03em; text-transform:uppercase; color:var(--m-faint); margin-bottom:5px;}
.rm-h-row{display:flex; align-items:center; gap:10px;}
.rm-head h1{font-size:29px; font-weight:700; letter-spacing:-.02em;}
.rm-count{font-family:'IBM Plex Mono',monospace; font-size:15px; font-weight:700; color:#fff; background:var(--bad); min-width:26px; height:26px; border-radius:13px; display:flex; align-items:center; justify-content:center; padding:0 7px;}
.rm-sub{margin:6px 0 0; font-size:13px; color:var(--m-muted);}

/* cards */
.rm-list{padding:6px 16px 0; display:flex; flex-direction:column; gap:12px;}
.rm-card{display:flex; background:var(--m-card); border:1px solid var(--m-line); border-radius:15px; overflow:hidden; box-shadow:0 1px 2px rgba(15,23,42,.04);}
.rm-rail{width:5px; flex:none;}
.rk-reg .rm-rail{background:var(--bad);} .rk-at .rm-rail{background:var(--warn);} .rk-cr .rm-rail{background:var(--info);}
.rk-reg{border-color:var(--bad-line);}
.rm-cbody{flex:1; padding:13px 15px; min-width:0;}
.rm-ctop{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:9px;}
.rm-flag{font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; padding:3px 8px; border-radius:6px;}
.rm-flag.rk-reg{background:var(--bad-bg); color:var(--bad);}
.rm-flag.rk-at{background:var(--warn-bg); color:var(--warn);}
.rm-flag.rk-cr{background:var(--info-bg); color:var(--info);}
.rm-tt{font-family:'IBM Plex Mono',monospace; font-size:12.5px; font-weight:600; color:var(--m-muted); white-space:nowrap;}
.rm-tt.tight{color:var(--bad);}
.rm-where{font-size:14.5px; margin-bottom:10px; display:flex; align-items:center; gap:7px; flex-wrap:wrap; white-space:nowrap;}
.rm-where b{font-weight:700;}

.rm-missing{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:8px;}
.rm-miss-l,.rm-avail-l,.rm-trail-l{font-size:10px; text-transform:uppercase; letter-spacing:.04em; color:var(--m-faint); font-weight:700;}
.rm-miss{display:inline-flex; align-items:center; gap:6px; font-size:12.5px; font-weight:600; padding:3px 10px 3px 4px; border-radius:20px; border:1px solid var(--m-line); background:#f7f9fb;}
.rm-fillsby{font-size:11px; color:var(--m-faint); margin-left:auto;}
.rm-lost{font-size:12px; color:var(--bad); font-weight:500; margin-bottom:8px;}

.rm-trail{font-size:12px; color:var(--m-muted); background:#f7f9fb; border:1px solid var(--m-line); border-radius:9px; padding:8px 11px; margin-bottom:8px; line-height:1.45;}
.rm-trail-l{margin-right:4px;}
.rm-avail{font-size:12px; color:var(--m-muted); margin-bottom:12px; line-height:1.4;}
.rm-avail-l{margin-right:5px;}
.rm-avail-none{font-style:italic;}

.rm-acts{display:flex; gap:7px;}
.rm-act{flex:1; height:42px; border:1px solid var(--m-line); background:var(--m-card); border-radius:11px; font-size:13px; font-weight:600; color:var(--m-ink); display:flex; align-items:center; justify-content:center; gap:4px;}
.rm-act:active{background:#f1f4f8;}
.rm-act:disabled{opacity:.4;}
.rm-act-danger{color:var(--bad); border-color:var(--bad-line);}

.rm-foot-note{text-align:center; color:var(--m-faint); font-size:11.5px; line-height:1.5; padding:20px 30px 0; text-wrap:pretty;}

/* empty success */
.rm-empty{text-align:center; padding:54px 30px 30px;}
.rm-check{width:60px; height:60px; border-radius:50%; background:var(--ok-bg); border:1px solid var(--ok-line); color:var(--ok); font-size:28px; display:flex; align-items:center; justify-content:center; margin:0 auto 20px;}
.rm-empty h2{font-size:21px; letter-spacing:-.01em;}
.rm-empty p{color:var(--m-muted); font-size:13.5px; margin:11px 0 0; line-height:1.55; text-wrap:pretty;}
.rm-cleared{display:inline-block; margin-top:18px; font-size:12.5px; font-weight:600; color:var(--ok); background:var(--ok-bg); border:1px solid var(--ok-line); padding:5px 13px; border-radius:20px;}

/* bottom sheet */
.rm-sheet-scrim{position:absolute; inset:0; background:rgba(15,23,42,.4); display:flex; align-items:flex-end; z-index:40; animation:fade .2s;}
.rm-sheet{width:100%; background:var(--m-card); border-radius:22px 22px 0 0; padding:8px 18px 26px; animation:rise .28s cubic-bezier(.32,.72,0,1); max-height:90%; overflow-y:auto;}
.rm-sheet.danger{border-top:3px solid var(--bad);}
.rm-grip{width:38px; height:5px; border-radius:10px; background:#d4dae1; margin:6px auto 12px;}
.rm-sheet h3{font-size:18px; font-weight:700; margin-bottom:6px;}
.rm-sheet-note{font-size:12.5px; color:var(--m-muted); margin:0 0 14px; line-height:1.45;}
.rm-pick{width:100%; display:flex; align-items:center; gap:9px; padding:13px; border:1px solid var(--m-line); border-radius:12px; background:var(--m-card); margin-bottom:8px; text-align:left; flex-wrap:wrap;}
.rm-pick.on{border-color:var(--accent); box-shadow:0 0 0 1px var(--accent);}
.rm-pick.off{opacity:.5;}
.rm-pick-n{font-weight:700; font-size:14px;}
.rm-pick-note{font-size:11.5px; color:var(--m-faint); margin-left:auto;}
.rm-band{font-size:10px; font-weight:700; padding:1px 7px; border-radius:5px;}
.rm-high{background:var(--ok-bg); color:var(--ok);} .rm-med{background:#eef1f5; color:#51607a;} .rm-low{background:#f1f3f6; color:#7c8696;}
.rm-slot-tag{font-size:11px; font-weight:700; padding:2px 8px; border-radius:20px; margin-left:auto;}
.rm-slot-tag.ok{background:var(--ok-bg); color:var(--ok);} .rm-slot-tag.no{background:#f1f3f6; color:var(--m-muted);}

.rm-casc{display:flex; flex-direction:column; gap:9px;}
.rm-cstep{display:flex; gap:11px; align-items:flex-start; padding:12px; border:1px solid var(--m-line); border-radius:12px; background:#f7f9fb; font-size:13px;}
.rm-cn{width:22px; height:22px; border-radius:50%; background:var(--bad); color:#fff; font-weight:700; font-size:12px; display:flex; align-items:center; justify-content:center; flex:none;}
.rm-csub{font-size:12px; color:var(--m-muted); margin-top:3px;}
.rm-ctoggle{display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--m-muted); font-weight:500;}
.rm-cwarn{margin-top:13px; font-size:12px; color:#7a2620; background:var(--bad-bg); border:1px solid var(--bad-line); border-radius:10px; padding:11px 13px; line-height:1.5;}

.rm-sheet-foot{display:flex; gap:10px; margin-top:16px;}
.rm-sb{flex:1; height:46px; border:1px solid var(--m-line); background:var(--m-card); border-radius:12px; font-size:15px; font-weight:600; color:var(--m-ink);}
.rm-sb-primary{background:var(--accent); color:#fff; border-color:var(--accent);}
.rm-sb-danger{background:var(--bad); color:#fff; border-color:var(--bad);}
.rm-sb:disabled{opacity:.45;}

.rm-toast{position:absolute; bottom:30px; left:50%; transform:translateX(-50%); background:var(--m-ink); color:#fff; padding:11px 17px; border-radius:11px; font-size:12.5px; font-weight:500; z-index:50; animation:fade .2s; max-width:88%; text-align:center;}
@keyframes fade{from{opacity:0;}}
@keyframes rise{from{transform:translateY(100%);}}
</style>
</head>
