<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Muster · At-Risk Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
:root{
  --accent:#2f5d86;
  --bg:#eef2f6; --surface:#ffffff; --rail:#f7f9fb;
  --ink:#101826; --muted:#5b6675; --faint:#93a0b0;
  --line:#e3e8ee; --line-soft:#eef2f6;
  --ok:#15803d; --ok-bg:#e7f4ec; --ok-line:#cbe6d5;
  --warn:#b45309; --warn-bg:#fbf0db; --warn-line:#f0ddb4;
  --bad:#be2f2a; --bad-bg:#fbe6e4; --bad-line:#f2cdc9;
  --info:#3257a8; --info-bg:#e7ecf7; --info-line:#cdd8ee;
  --cap:#2f5d86; --mate:#2f7d70;
  --radius:11px;
  --shadow:0 1px 2px rgba(15,23,42,.04), 0 12px 28px -18px rgba(15,23,42,.28);
}
*{box-sizing:border-box;}
html,body{margin:0; min-height:100%;}
body{font-family:'IBM Plex Sans',system-ui,sans-serif; background:var(--bg); color:var(--ink); font-size:14px; line-height:1.45; -webkit-font-smoothing:antialiased;}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;}
button{font-family:inherit; cursor:pointer;}
h1,h2{margin:0; font-weight:600;}

/* topbar */
.shell{min-height:100vh; display:flex; flex-direction:column;}
.topbar{height:52px; flex:none; display:flex; align-items:center; justify-content:space-between; gap:20px; padding:0 18px; background:var(--surface); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:20;}
.brand{display:flex; align-items:center; gap:9px; font-size:15px;}
.brand-mark{width:14px; height:14px; border-radius:4px; background:var(--accent);}
.brand-name{font-weight:700;}
.brand-sep{color:var(--faint);}
.brand-surface{font-weight:500; color:var(--muted);}
.surface-nav{display:flex; align-items:center; gap:4px; margin-left:auto; margin-right:auto; font-size:13px;}
.surface-nav a{color:var(--muted); text-decoration:none; padding:5px 11px; border-radius:7px; font-weight:500;}
.surface-nav a:hover{background:var(--bg);}
.surface-nav-on{color:var(--ink); font-weight:600; padding:5px 11px; border-radius:7px; background:var(--bg);}
.topbar-r{display:flex; align-items:center; gap:14px; font-size:12.5px;}
.tenant{padding:3px 9px; background:var(--rail); border:1px solid var(--line); border-radius:6px; font-weight:600;}
.today{color:var(--muted);}

/* buttons */
.btn{border:1px solid var(--line); background:var(--surface); color:var(--ink); font-weight:600; font-size:13px; padding:8px 14px; border-radius:8px; white-space:nowrap;}
.btn:hover{background:var(--bg);}
.btn-primary{background:var(--accent); border-color:var(--accent); color:#fff;}
.btn-primary:hover{background:color-mix(in oklab,var(--accent) 88%,#000);}
.btn-danger{background:var(--bad); border-color:var(--bad); color:#fff;}
.btn-danger:hover{background:color-mix(in oklab,var(--bad) 88%,#000);}
.btn-danger-ghost{color:var(--bad); border-color:var(--bad-line);}
.btn-danger-ghost:hover{background:var(--bad-bg);}
.btn-s{padding:6px 12px; font-size:12.5px;}
.btn:disabled{opacity:.4; cursor:default;}
.boat-dot{width:9px; height:9px; border-radius:50%; display:inline-block; background:var(--faint);}
[data-boat="mt"]{background:var(--cap);}
[data-boat="tw"]{background:var(--mate);}
.role-ic{display:inline-flex; align-items:center; justify-content:center; color:#fff; font-weight:700; border-radius:5px;}
.role-ic.sm{width:17px; height:17px; font-size:10px;}
.role-captain{background:var(--cap);} .role-mate{background:var(--mate);}

/* board layout */
.board-wrap{flex:1; max-width:920px; width:100%; margin:0 auto; padding:26px 22px 70px;}
.board-hd{display:flex; align-items:flex-start; justify-content:space-between; gap:20px; margin-bottom:22px;}
.bh-l h1{font-size:26px; letter-spacing:-.02em;}
.bh-sub{margin:6px 0 0; color:var(--muted); font-size:13.5px; max-width:440px; text-wrap:pretty;}
.bh-count{display:flex; flex-direction:column; align-items:flex-end; gap:2px;}
.bhc-n{font-family:'IBM Plex Mono',monospace; font-size:30px; font-weight:600; line-height:1; color:var(--bad);}
.bhc-l{font-size:12px; color:var(--muted);}
.bhc-reg{margin-top:4px; font-size:11px; font-weight:700; color:var(--bad); background:var(--bad-bg); border:1px solid var(--bad-line); padding:2px 8px; border-radius:20px;}

.risk-list{display:flex; flex-direction:column; gap:14px;}

/* risk row */
.risk{display:flex; background:var(--surface); border:1px solid var(--line); border-radius:14px; overflow:hidden; box-shadow:var(--shadow);}
.risk-rail{width:5px; flex:none;}
.k-regression .risk-rail{background:var(--bad);}
.k-atrisk .risk-rail{background:var(--warn);}
.k-credential .risk-rail{background:var(--info);}
.k-regression{border-color:var(--bad-line);}
.risk-body{flex:1; padding:16px 18px; display:flex; flex-direction:column; gap:12px; min-width:0;}

.risk-top{display:flex; align-items:flex-start; justify-content:space-between; gap:16px;}
.kind-flag{display:inline-block; font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; padding:3px 9px; border-radius:6px; margin-bottom:8px;}
.kind-flag.k-regression{background:var(--bad-bg); color:var(--bad);}
.kind-flag.k-atrisk{background:var(--warn-bg); color:var(--warn);}
.kind-flag.k-credential{background:var(--info-bg); color:var(--info);}
.risk-where{font-size:15px; display:flex; align-items:center; gap:8px; white-space:nowrap;}
.risk-where b{font-weight:700;}
.risk-time{text-align:right; flex:none;}
.tt{font-family:'IBM Plex Mono',monospace; font-size:15px; font-weight:600;}
.tt-tight{color:var(--bad);}
.tt-sub{display:block; font-size:11px; color:var(--faint); margin-top:2px;}

.risk-mid{}
.risk-missing{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
.rm-label,.ra-label,.trail-label{font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--faint); font-weight:600; flex:none;}
.missing{display:flex; gap:6px;}
.miss-chip{display:inline-flex; align-items:center; gap:6px; font-size:12.5px; font-weight:600; padding:3px 10px 3px 4px; border-radius:20px; border:1px solid var(--line); background:var(--rail);}
.lost{font-size:12px; color:var(--bad); font-weight:500;}

/* escalation trail */
.trail{display:flex; align-items:baseline; gap:10px; padding:9px 12px; background:var(--rail); border:1px solid var(--line-soft); border-radius:9px; flex-wrap:wrap;}
.trail-segs{display:flex; align-items:baseline; gap:6px; flex-wrap:wrap; font-size:12.5px; color:var(--muted);}
.tr-seg b{font-family:'IBM Plex Mono',monospace; color:var(--ink);}
.tr-mut{color:var(--faint);}
.tr-bad{color:var(--bad); font-weight:600;}
.tr-exhaust{color:var(--bad); font-weight:700; text-transform:uppercase; font-size:11px; letter-spacing:.04em;}
.tr-dot{color:var(--faint);}
.trail-note{font-size:12px; color:var(--muted); font-style:italic; padding:0 2px;}

.risk-avail{display:flex; align-items:center; gap:10px; flex-wrap:wrap; font-size:12.5px;}
.ra-none{color:var(--muted); font-style:italic;}
.ra-person{display:inline-flex; align-items:center; gap:7px; font-weight:600;}
.ra-person em{font-style:normal; font-weight:400; color:var(--faint); font-size:11.5px;}
.ra-band{font-size:10px; font-weight:700; padding:1px 6px; border-radius:5px;}
.ra-high{background:var(--ok-bg); color:var(--ok);}
.ra-med{background:#eef1f5; color:#51607a;}
.ra-low{background:#f1f3f6; color:#7c8696;}

.risk-actions{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:2px; padding-top:12px; border-top:1px solid var(--line-soft);}
.ra-decisions{display:flex; gap:8px;}
.open-assign{border:0; background:transparent; color:var(--accent); font-size:12.5px; font-weight:600; padding:6px 4px;}
.open-assign:hover{text-decoration:underline;}

/* empty success */
.empty-success{text-align:center; padding:70px 30px; max-width:520px; margin:0 auto;}
.es-mark{width:64px; height:64px; border-radius:50%; background:var(--ok-bg); border:1px solid var(--ok-line); color:var(--ok); font-size:30px; display:flex; align-items:center; justify-content:center; margin:0 auto 22px;}
.empty-success h2{font-size:22px; letter-spacing:-.01em;}
.empty-success p{color:var(--muted); font-size:14px; margin:12px 0 0; line-height:1.55; text-wrap:pretty;}
.es-resolved{display:inline-block; margin-top:20px; font-size:12.5px; font-weight:600; color:var(--ok); background:var(--ok-bg); border:1px solid var(--ok-line); padding:5px 13px; border-radius:20px;}
.es-foot{margin-top:18px; font-size:12px; color:var(--faint);}

/* resolved strip */
.resolved-strip{margin-top:22px; padding:12px 14px; background:var(--rail); border:1px solid var(--line); border-radius:11px; display:flex; align-items:center; gap:12px; flex-wrap:wrap;}
.rs-label{font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--faint); font-weight:600;}
.rs-item{font-size:12.5px; font-weight:600; display:inline-flex; align-items:center; gap:7px;}
.resolved-tag{font-size:11px; font-weight:600; color:var(--muted); background:var(--surface); border:1px solid var(--line); padding:2px 8px; border-radius:20px;}

/* modal */
.modal-scrim{position:fixed; inset:0; background:rgba(15,23,42,.45); backdrop-filter:blur(2px); display:flex; align-items:center; justify-content:center; z-index:50; padding:24px;}
.modal{background:var(--surface); border-radius:14px; width:min(540px,100%); max-height:88vh; overflow:hidden; display:flex; flex-direction:column; box-shadow:0 24px 64px -24px rgba(15,23,42,.5); border:1px solid var(--line);}
.modal-danger{border-top:3px solid var(--bad);}
.modal-head{display:flex; align-items:center; justify-content:space-between; padding:18px 20px 14px; border-bottom:1px solid var(--line-soft);}
.modal-head h2{font-size:17px;}
.modal-x{border:0; background:transparent; color:var(--faint); font-size:14px; padding:4px 7px; border-radius:6px;}
.modal-x:hover{background:var(--bg);}
.modal-body{padding:18px 20px; overflow-y:auto;}
.modal-foot{display:flex; justify-content:flex-end; gap:9px; padding:14px 20px; border-top:1px solid var(--line-soft); background:var(--rail);}
.modal-note{font-size:12.5px; color:var(--muted); margin:0 0 14px; line-height:1.5; text-wrap:pretty;}
.modal-l{display:block; font-size:12px; font-weight:600; color:var(--muted); margin-top:14px;}
.modal-ta{width:100%; margin-top:6px; border:1px solid var(--line); border-radius:9px; padding:10px 12px; font-family:inherit; font-size:13px; color:var(--ink); resize:vertical; outline:none;}
.modal-ta:focus{border-color:var(--accent);}

/* lean */
.lean-people{display:flex; flex-direction:column; gap:7px;}
.lean-person{display:flex; align-items:center; gap:10px; padding:11px 13px; border:1px solid var(--line); border-radius:10px; background:var(--surface); text-align:left;}
.lean-person.on{border-color:var(--accent); box-shadow:0 0 0 1px var(--accent);}
.lp-name{font-weight:700; font-size:13.5px;}
.lp-note{font-size:11.5px; color:var(--faint); margin-left:auto;}

/* reschedule */
.reslots{display:flex; flex-direction:column; gap:8px;}
.reslot{display:flex; align-items:center; gap:10px; padding:12px 13px; border:1px solid var(--line); border-radius:10px; background:var(--surface); text-align:left; flex-wrap:wrap;}
.reslot.on{border-color:var(--accent); box-shadow:0 0 0 1px var(--accent);}
.reslot-no{opacity:.55;}
.reslot-l{font-weight:700; font-size:13.5px;}
.reslot-tag{font-size:11px; font-weight:700; padding:2px 8px; border-radius:20px;}
.rt-ok{background:var(--ok-bg); color:var(--ok);}
.rt-no{background:#f1f3f6; color:var(--muted);}
.reslot-note{font-size:11.5px; color:var(--faint); margin-left:auto;}
.comms-note{margin-top:13px; font-size:12px; color:var(--accent); background:var(--info-bg); border:1px solid var(--info-line); border-radius:8px; padding:9px 12px;}

/* cancel cascade */
.cascade{display:flex; flex-direction:column; gap:10px;}
.cascade-step{display:flex; gap:12px; padding:12px 13px; border:1px solid var(--line); border-radius:10px; background:var(--rail);}
.cs-n{width:22px; height:22px; border-radius:50%; background:var(--bad); color:#fff; font-weight:700; font-size:12px; display:flex; align-items:center; justify-content:center; flex:none;}
.cs-list{display:flex; flex-wrap:wrap; gap:6px; margin-top:7px;}
.cs-cust{font-size:11.5px; background:var(--surface); border:1px solid var(--line); padding:2px 8px; border-radius:6px;}
.cs-cust i{font-style:normal; color:var(--faint);}
.cs-sub{font-size:12px; color:var(--muted); margin-top:3px;}
.cs-toggle{display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--muted); margin-top:7px; font-weight:500; cursor:pointer;}
.cancel-warn{margin-top:14px; font-size:12px; color:#7a2620; background:var(--bad-bg); border:1px solid var(--bad-line); border-radius:9px; padding:11px 13px; line-height:1.5; text-wrap:pretty;}

.toast{position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; padding:11px 18px; border-radius:10px; font-size:13px; font-weight:500; box-shadow:0 12px 32px -12px rgba(0,0,0,.5); z-index:60; animation:toast-in .2s ease; max-width:580px; text-align:center;}
@keyframes toast-in{from{opacity:0; transform:translate(-50%,8px);}}

@media (max-width:720px){ .surface-nav{display:none;} .risk-top{flex-direction:column; gap:8px;} .risk-time{text-align:left;} }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>

<script type="text/babel" src="riskdata.jsx"></script>

</body>
