<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Muster · Crew (mobile)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
:root{
  --accent:#2f5d86;
  --m-bg:#eef2f6; --m-card:#ffffff;
  --m-ink:#101826; --m-muted:#5b6675; --m-faint:#93a0b0; --m-line:#e7ebf1;
  --ok:#15803d; --ok-bg:#e7f4ec; --ok-line:#cbe6d5;
  --warn:#b45309; --warn-bg:#fbf0db; --warn-line:#f0ddb4;
  --bad:#be2f2a; --bad-bg:#fbe6e4; --bad-line:#f2cdc9;
  --cap:#2f5d86; --cap-bg:#e6eef6; --mate:#2f7d70; --mate-bg:#e3f1ee;
}
*{box-sizing:border-box;}
html,body{margin:0; min-height:100%;}
body{
  background:#dfe4ea;
  background-image:radial-gradient(circle at 50% 0%, #e9edf2, #d7dce3);
  font-family:'IBM Plex Sans',system-ui,sans-serif;
  display:flex; flex-direction:column; align-items:center; gap:18px;
  padding:34px 16px 48px; min-height:100vh;
}
.mono{font-family:'IBM Plex Mono',monospace; font-variant-ligatures:none;}
.page-cap{text-align:center; color:#5b6675; font-size:13px; max-width:380px;}
.page-cap b{color:#101826;}
.page-cap a{color:var(--accent); text-decoration:none; font-weight:600;}
button{font-family:inherit; cursor:pointer;}
h1,h2,h3{margin:0;}

/* ---- app frame interior ---- */
.m-app{position:relative; height:100%; overflow:hidden; background:var(--m-bg);}
.m-screen{position:absolute; inset:0; transition:transform .34s cubic-bezier(.32,.72,0,1); background:var(--m-bg);}
.m-screen.pushed{transform:translateX(-26%);}
.m-over{transform:translateX(100%); box-shadow:-12px 0 28px rgba(15,23,42,.12);}
.m-over.active{transform:translateX(0);}
.m-scroll{height:100%; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:54px 0 38px; color:var(--m-ink);}

/* ---- list header ---- */
.m-head{padding:6px 16px 4px;}
.m-head-top{display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:14px;}
.m-eyebrow{font-size:11.5px; font-weight:600; letter-spacing:.04em; text-transform:uppercase; color:var(--m-faint); margin-bottom:2px; white-space:nowrap;}
.m-head h1{font-size:30px; font-weight:700; letter-spacing:-.02em;}
.m-mark{width:18px; height:18px; border-radius:5px; background:var(--accent); margin-top:6px;}

.m-pool{background:var(--m-card); border:1px solid var(--m-line); border-radius:16px; padding:13px 15px; margin-bottom:13px; box-shadow:0 1px 2px rgba(15,23,42,.03);}
.m-pool-counts{display:flex; justify-content:space-between;}
.m-pc{display:flex; flex-direction:column; gap:1px;}
.m-pc b{font-family:'IBM Plex Mono',monospace; font-size:21px; font-weight:600; letter-spacing:-.01em;}
.m-pc span{font-size:11.5px; color:var(--m-muted);}
.m-pool-issues{display:flex; gap:7px; margin-top:12px; padding-top:11px; border-top:1px solid var(--m-line); flex-wrap:wrap;}
.m-pi{font-size:12px; font-weight:600; padding:3px 9px; border-radius:7px;}
.m-pi-bad{background:var(--bad-bg); color:var(--bad);}
.m-pi-warn{background:var(--warn-bg); color:var(--warn);}
.m-pi-flat{background:#eef1f5; color:#5b6675;}

.m-search{display:flex; align-items:center; gap:8px; background:var(--m-card); border:1px solid var(--m-line); border-radius:12px; padding:0 12px; margin-bottom:12px;}
.m-search-i{color:var(--m-faint); font-size:16px;}
.m-search input{flex:1; border:0; background:transparent; padding:11px 0; font-size:15px; outline:none; color:var(--m-ink);}
.m-search button{border:0; background:transparent; color:var(--m-faint); font-size:12px; padding:6px;}

.m-filters{display:flex; gap:7px; overflow-x:auto; padding-bottom:4px; margin:0 -16px; padding-left:16px; padding-right:16px; scrollbar-width:none;}
.m-filters::-webkit-scrollbar{display:none;}
.m-filter{flex:none; border:1px solid var(--m-line); background:var(--m-card); color:var(--m-muted); font-size:13px; font-weight:600; padding:7px 13px; border-radius:20px; display:flex; align-items:center; gap:6px; white-space:nowrap;}
.m-filter.on{background:var(--m-ink); color:#fff; border-color:var(--m-ink);}
.m-fbadge{font-family:'IBM Plex Mono',monospace; font-size:10px; background:var(--bad); color:#fff; border-radius:20px; padding:0 5px; min-width:15px; text-align:center;}
.m-filter.on .m-fbadge{background:#fff; color:var(--bad);}

/* ---- list rows ---- */
.m-list{padding:10px 16px 0; display:flex; flex-direction:column; gap:8px;}
.m-empty{text-align:center; color:var(--m-faint); font-size:13.5px; padding:32px 0;}
.m-row{position:relative; width:100%; text-align:left; display:flex; align-items:center; gap:10px; background:var(--m-card); border:1px solid var(--m-line); border-radius:14px; padding:13px 30px 13px 14px; box-shadow:0 1px 2px rgba(15,23,42,.03);}
.m-row:active{background:#f7f9fb;}
.m-row.inactive{opacity:.6;}
.m-row-l{flex:1; min-width:0;}
.m-row-name{font-size:15.5px; font-weight:600; display:flex; align-items:center; gap:7px; margin-bottom:5px;}
.m-row-meta{display:flex; gap:5px; flex-wrap:wrap;}
.m-row-issue{margin-top:6px; font-size:12px; font-weight:600;}
.m-row-issue.m-bad{color:var(--bad);}
.m-row-issue.m-warn{color:var(--warn);}
.m-row-r{display:flex; flex-direction:column; align-items:flex-end; gap:6px; flex:none;}
.m-chev{position:absolute; right:11px; top:50%; transform:translateY(-50%); color:var(--m-faint);}
.m-tag{font-size:9.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--m-faint); border:1px solid var(--m-line); padding:1px 5px; border-radius:5px; font-weight:600;}
.m-tag.lg{font-size:10.5px; padding:2px 7px;}

/* chips */
.m-chip{font-size:10.5px; font-weight:600; padding:2px 8px; border-radius:20px; text-transform:capitalize; line-height:1.5;}
.m-chip-captain{background:var(--cap-bg); color:var(--cap);}
.m-chip-mate{background:var(--mate-bg); color:var(--mate);}
.m-chip-trainee{background:#eef1f5; color:#6b7686; font-weight:500;}
.m-chip-pto{background:#eef1f5; color:#6b7686; font-weight:500;}

/* band */
.m-band{display:inline-flex; align-items:center; gap:3px; font-size:11px; font-weight:700; padding:3px 9px; border-radius:6px; letter-spacing:.02em;}
.m-pin{font-size:8px; opacity:.85;}
.m-band-high{background:var(--ok-bg); color:var(--ok);}
.m-band-med{background:#eef1f5; color:#51607a;}
.m-band-low{background:#f1f3f6; color:#7c8696;}
.m-band-new{background:#e6eef6; color:var(--accent);}

/* flag dot */
.m-flag{width:9px; height:9px; border-radius:50%; display:inline-block;}
.m-flag-valid{background:var(--ok);}
.m-flag-soon{background:var(--warn);}
.m-flag-expired{background:var(--bad);}

.m-foot-note{text-align:center; color:var(--m-faint); font-size:11.5px; line-height:1.5; padding:18px 30px 6px; text-wrap:pretty;}

/* ---- detail ---- */
.m-detail-scroll{padding-top:50px;}
.m-dbar{padding:0 8px 2px;}
.m-back{display:inline-flex; align-items:center; gap:3px; border:0; background:transparent; color:var(--accent); font-size:16px; font-weight:600; padding:6px 8px;}
.m-dhead{padding:6px 18px 14px;}
.m-dname{font-size:25px; font-weight:700; letter-spacing:-.02em; display:flex; align-items:center; gap:9px;}
.m-dsub{display:flex; align-items:center; gap:8px; margin-top:8px;}
.m-status{display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:600; color:var(--m-muted); background:#eef1f5; padding:3px 10px 3px 8px; border-radius:20px;}
.m-status i{width:7px; height:7px; border-radius:50%; background:var(--m-faint);}
.m-status.on{background:var(--ok-bg); color:var(--ok);}
.m-status.on i{background:var(--ok);}

.m-contact{display:flex; gap:9px; align-items:center; padding:0 16px 14px; flex-wrap:wrap;}
.m-cbtn{flex:1; min-width:120px; height:48px; display:flex; align-items:center; justify-content:center; gap:8px; border-radius:13px; font-size:15px; font-weight:600; text-decoration:none;}
.m-call{background:var(--accent); color:#fff;}
.m-text{background:var(--m-card); color:var(--accent); border:1px solid var(--cap-bg);}
.m-phone{flex-basis:100%; text-align:center; font-size:13px; color:var(--m-muted);}

.m-card{background:var(--m-card); border:1px solid var(--m-line); border-radius:16px; margin:0 16px 12px; padding:14px 16px; box-shadow:0 1px 2px rgba(15,23,42,.03);}
.m-card-h{display:flex; align-items:center; justify-content:space-between; margin-bottom:11px;}
.m-card-h h2{font-size:11.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--m-faint); font-weight:700;}
.m-add{border:0; background:var(--cap-bg); color:var(--accent); font-size:12.5px; font-weight:600; padding:5px 11px; border-radius:8px;}

.m-standing{display:flex; align-items:center; gap:10px;}
.m-score{font-size:22px; font-weight:600;}
.m-cold{font-size:12.5px; color:var(--accent); line-height:1.4;}
.m-thumb{display:inline-block; margin-top:10px; font-size:12px; font-weight:600; padding:4px 10px; border-radius:7px;}
.m-thumb-boost{background:var(--cap-bg); color:var(--accent);}
.m-thumb-floor{background:var(--ok-bg); color:var(--ok);}
.m-reasons{list-style:none; margin:11px 0 0; padding:0; display:flex; flex-direction:column; gap:6px;}
.m-reasons li{position:relative; padding-left:15px; font-size:13px; color:var(--m-muted); line-height:1.4;}
.m-reasons li:before{content:'—'; position:absolute; left:0; color:var(--m-faint);}

.m-pmrow{display:flex; align-items:center; gap:9px; font-size:13px; padding:5px 0;}
.m-pmnote{color:var(--m-muted);}
.m-pmnote b{font-family:'IBM Plex Mono',monospace; color:var(--m-ink);}
.m-pmrow.out .m-pmblock{color:var(--bad); font-weight:500;}

.m-cred{display:grid; grid-template-columns:auto 1fr auto; gap:8px 10px; align-items:center; padding:9px 0; border-top:1px solid var(--m-line);}
.m-card .m-cred:first-of-type{border-top:0;}
.m-cred-type{font-weight:700; font-size:13.5px;}
.m-cred-mid{font-size:12px; color:var(--m-muted);}
.m-cred-exp{display:flex; flex-direction:column; align-items:flex-end; gap:1px; font-size:12.5px;}
.m-cred-n{font-size:10.5px; font-weight:600;}
.m-cred-n.m-valid{color:var(--ok);} .m-cred-n.m-soon{color:var(--warn);} .m-cred-n.m-expired{color:var(--bad);}
.m-cred-expired .m-cred-type{color:var(--bad);}
.m-cred-soon .m-cred-type{color:var(--warn);}

.m-empty-line{font-size:13px; color:var(--m-faint); line-height:1.45;}
.m-supp{display:flex; align-items:center; gap:10px; padding:8px 0; border-top:1px solid var(--m-line); font-size:13px;}
.m-card .m-supp:first-of-type{border-top:0;}
.m-supp-r{flex:1; color:var(--m-muted);}
.m-supp-x{border:0; background:transparent; color:var(--m-faint); font-size:12px; padding:4px 6px;}

/* PTO sheet */
.m-sheet-scrim{position:absolute; inset:0; background:rgba(15,23,42,.34); display:flex; align-items:flex-end; z-index:40; animation:fade .2s;}
.m-sheet{width:100%; background:var(--m-card); border-radius:22px 22px 0 0; padding:8px 20px 30px; animation:rise .28s cubic-bezier(.32,.72,0,1);}
.m-sheet-grip{width:38px; height:5px; border-radius:10px; background:#d4dae1; margin:6px auto 12px;}
.m-sheet h3{font-size:17px; font-weight:700;}
.m-sheet-note{font-size:12.5px; color:var(--m-muted); margin:6px 0 14px; line-height:1.45;}
.m-l{display:flex; flex-direction:column; gap:5px; font-size:12px; font-weight:600; color:var(--m-muted); margin-bottom:11px;}
.m-l input{border:1px solid var(--m-line); border-radius:11px; padding:11px 12px; font-size:15px; font-family:inherit; color:var(--m-ink); background:#fff; outline:none;}
.m-l input:focus{border-color:var(--accent);}
.m-sheet-actions{display:flex; gap:10px; margin-top:6px;}
.m-sb{flex:1; height:46px; border:1px solid var(--m-line); background:var(--m-card); border-radius:12px; font-size:15px; font-weight:600; color:var(--m-ink);}
.m-sb-primary{background:var(--accent); color:#fff; border-color:var(--accent);}
.m-sb:disabled{opacity:.45;}

.m-toast{position:absolute; bottom:46px; left:50%; transform:translateX(-50%); background:var(--m-ink); color:#fff; padding:10px 16px; border-radius:11px; font-size:13px; font-weight:500; z-index:50; animation:fade .2s;}
@keyframes fade{from{opacity:0;}}
@keyframes rise{from{transform:translateY(100%);}}
</style>
</head>
<body>
<div class="page-cap"><b>Muster · mobile</b> — read-first crew view for checking the pool from the dock. Tap a name to call/text or log PTO. <a href="Crew Roster.html">↗ Desktop roster</a></div>
