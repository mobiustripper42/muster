<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Muster · Event Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
:root{
  --accent:#2f5d86;
  --bg:#eef2f6; --surface:#ffffff; --rail:#f7f9fb;
  --ink:#101826; --muted:#5b6675; --faint:#93a0b0;
  --line:#e3e8ee; --line-soft:#eef2f6;
  --ok:#15803d; --ok-bg:#e7f4ec; --ok-line:#cbe6d5;
  --warn:#b45309; --warn-bg:#fbf0db; --warn-line:#f0ddb4;
  --bad:#be2f2a; --bad-bg:#fbe6e4; --bad-line:#f2cdc9;
  --cap:#2f5d86; --cap-bg:#e6eef6;
  --mate:#2f7d70; --mate-bg:#e3f1ee;
  --radius:11px;
  --shadow:0 1px 2px rgba(15,23,42,.04), 0 12px 28px -18px rgba(15,23,42,.28);
}
*{box-sizing:border-box;}
html,body{margin:0; height:100%;}
body{font-family:'IBM Plex Sans',system-ui,sans-serif; background:var(--bg); color:var(--ink); font-size:14px; line-height:1.45; -webkit-font-smoothing:antialiased;}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace; font-variant-ligatures:none;}
button{font-family:inherit; cursor:pointer;}
h2,h3{margin:0; font-weight:600;}

/* shell + topbar (shared) */
.shell{height:100vh; display:flex; flex-direction:column; overflow:hidden;}
.topbar{height:52px; flex:none; display:flex; align-items:center; justify-content:space-between; gap:20px; padding:0 18px; background:var(--surface); border-bottom:1px solid var(--line);}
.brand{display:flex; align-items:center; gap:9px; font-size:15px;}
.brand-mark{width:14px; height:14px; border-radius:4px; background:var(--accent); display:inline-block;}
.brand-name{font-weight:700; letter-spacing:-.01em;}
.brand-sep{color:var(--faint); font-weight:400;}
.brand-surface{font-weight:500; color:var(--muted);}
.surface-nav{display:flex; align-items:center; gap:4px; margin-left:auto; margin-right:auto; font-size:13px;}
.surface-nav a{color:var(--muted); text-decoration:none; padding:5px 11px; border-radius:7px; font-weight:500;}
.surface-nav a:hover{background:var(--bg);}
.surface-nav-on{color:var(--ink); font-weight:600; padding:5px 11px; border-radius:7px; background:var(--bg);}
.topbar-r{display:flex; align-items:center; gap:14px; font-size:12.5px;}
.tenant{padding:3px 9px; background:var(--rail); border:1px solid var(--line); border-radius:6px; font-weight:600;}
.today{color:var(--muted);}

.panes{flex:1; display:grid; grid-template-columns:minmax(520px,1fr) minmax(440px,560px); overflow:hidden;}

/* search + buttons (shared) */
.search{flex:1; display:flex; align-items:center; gap:7px; padding:0 10px; background:var(--bg); border:1px solid var(--line); border-radius:8px;}
.search:focus-within{border-color:var(--accent); box-shadow:0 0 0 3px color-mix(in oklab,var(--accent) 14%,transparent);}
.search-i{color:var(--faint); font-size:15px;}
.search input{flex:1; border:0; background:transparent; padding:8px 0; font-size:13.5px; color:var(--ink); outline:none;}
.search-x{border:0; background:transparent; color:var(--faint); font-size:11px; padding:4px;}
.btn{border:1px solid var(--line); background:var(--surface); color:var(--ink); font-weight:600; font-size:13px; padding:8px 14px; border-radius:8px; white-space:nowrap;}
.btn:hover{background:var(--bg);}
.btn-primary{background:var(--accent); border-color:var(--accent); color:#fff;}
.btn-primary:hover{background:color-mix(in oklab,var(--accent) 88%,#000);}
.btn-s{padding:5px 11px; font-size:12px;}
.btn:disabled{opacity:.5; cursor:default;}
.inp{border:1px solid var(--line); border-radius:7px; padding:8px 10px; font-size:13px; font-family:inherit; background:var(--surface); color:var(--ink); outline:none;}
.inp:focus{border-color:var(--accent); box-shadow:0 0 0 3px color-mix(in oklab,var(--accent) 14%,transparent);}
.inp-sm{padding:6px 9px; font-size:12.5px;}
.pax-inp{width:62px;}
.mini-label{font-size:11.5px; color:var(--faint);}
.inline-form{display:flex; gap:7px; align-items:center; flex-wrap:wrap; padding:10px; background:var(--bg); border:1px dashed var(--line); border-radius:8px; margin-bottom:6px;}
.empty-line{font-size:12.5px; color:var(--faint); padding:8px 2px;}

.etag{font-size:10px; font-weight:600; padding:2px 7px; border-radius:5px; letter-spacing:.01em; white-space:nowrap;}
.etag-manual{background:#eef1f5; color:#5b6675;}
.etag-edited{background:var(--warn-bg); color:var(--warn);}
.etag-new{background:#e6eef6; color:var(--accent);}
.etag-conflict{background:var(--warn-bg); color:var(--warn);}
.etag-cancelled{background:var(--bad-bg); color:var(--bad);}

/* boat dots */
.erow-boat-dot,.bf-dot{width:8px; height:8px; border-radius:50%; display:inline-block; background:var(--faint);}
.erow-boat-dot.lg{width:9px; height:9px;}
[data-boat="mt"]{background:var(--cap);}
[data-boat="tw"]{background:var(--mate);}

/* ---- event list (left) ---- */
.elist{display:flex; flex-direction:column; overflow:hidden; border-right:1px solid var(--line); background:var(--rail);}
.elist-top{flex:none; padding:14px 16px 0; background:var(--surface); border-bottom:1px solid var(--line);}
.elist-summary{display:flex; align-items:center; gap:20px; padding-bottom:12px;}
.es-stat{display:flex; align-items:baseline; gap:5px;}
.es-stat b{font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:16px;}
.es-stat span{font-size:12px; color:var(--muted);}
.es-sync{margin-left:auto; display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--faint);}
.es-sync-dot{width:7px; height:7px; border-radius:50%; background:var(--ok);}
.elist-tools{display:flex; gap:10px; padding-bottom:12px; align-items:center;}
.boat-filter{display:flex; gap:6px; padding-bottom:11px;}
.bf{display:flex; align-items:center; gap:6px; border:1px solid var(--line); background:var(--surface); color:var(--muted); padding:5px 11px; border-radius:7px; font-size:12.5px; font-weight:500;}
.bf:hover{background:var(--bg);}
.bf.on{background:var(--ink); color:#fff; border-color:var(--ink);}
.bf.on .bf-dot{outline:1px solid rgba(255,255,255,.5);}

.elist-scroll{flex:1; overflow-y:auto; padding:6px 10px 28px;}
.elist-empty{padding:40px; text-align:center; color:var(--faint);}
.edate-group{margin-top:10px;}
.edate-head{display:flex; align-items:baseline; justify-content:space-between; padding:6px 6px 8px; position:sticky; top:0; background:var(--rail); z-index:1;}
.edate-label{font-size:13px; font-weight:700; letter-spacing:-.01em;}
.edate-meta{font-size:11.5px; color:var(--faint);}

.erow{width:100%; display:grid; grid-template-columns:92px 1fr 58px 124px; gap:12px; align-items:center; text-align:left; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:11px 13px; margin-bottom:6px; color:inherit; transition:border-color .12s, box-shadow .12s;}
.erow:hover{border-color:color-mix(in oklab,var(--accent) 40%,var(--line)); box-shadow:var(--shadow);}
.erow-sel{border-color:var(--accent); box-shadow:0 0 0 1px var(--accent), var(--shadow);}
.erow-time{display:flex; align-items:center; gap:7px;}
.erow-t{font-weight:600; font-size:13px;}
.erow-mid{min-width:0;}
.erow-boat{font-size:13px; font-weight:500; color:var(--muted); margin-bottom:3px;}
.erow-tags{display:flex; gap:5px; flex-wrap:wrap;}
.erow-res{text-align:center;}
.erow-res-n{font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:15px; display:block;}
.erow-res-l{font-size:10px; color:var(--faint);}

.capbar{display:flex; align-items:center; gap:8px;}
.capbar-track{flex:1; height:7px; background:#e7ebf1; border-radius:6px; overflow:hidden;}
.capbar-fill{height:100%; border-radius:6px;}
.cf-open{background:var(--mate);}
.cf-high{background:var(--warn);}
.cf-full{background:var(--accent);}
.capbar-num{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--muted); white-space:nowrap;}
.capbar-num b{color:var(--ink);}

/* ---- detail (right) ---- */
.detail-pane{overflow:hidden; background:var(--surface); display:flex;}
.detail-empty{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; color:var(--faint); gap:10px;}
.detail-empty-mark{font-size:30px; opacity:.4;}
.edetail{flex:1; display:flex; flex-direction:column; overflow:hidden;}
.ed-head{flex:none; padding:18px 22px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:flex-start; gap:16px;}
.ed-eyebrow{display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--muted); font-weight:500; margin-bottom:5px;}
.ed-head h2{font-size:22px; letter-spacing:-.01em;}
.ed-sub{font-size:12.5px; color:var(--faint); margin-top:3px;}
.ed-cap{text-align:right; flex:none;}
.ed-cap-n{font-family:'IBM Plex Mono',monospace; font-size:26px; font-weight:600; line-height:1;}
.ed-cap-n span{font-size:16px; color:var(--faint);}
.cf-text-open{color:var(--mate);} .cf-text-high{color:var(--warn);} .cf-text-full{color:var(--accent);}
.ed-cap-l{font-size:11px; color:var(--faint); margin-top:4px;}

.ed-scroll{flex:1; overflow-y:auto; padding:16px 22px 40px;}
.ed-shiftbar{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:11px 13px; background:var(--rail); border:1px solid var(--line); border-radius:10px;}
.ed-shift{display:flex; align-items:center; gap:9px; font-size:13px;}
.ed-shift.muted{color:var(--faint);}
.ed-shift-l{color:var(--muted);}
.ed-shift-name{font-weight:600;}
.shift-state{font-size:11px; font-weight:700; padding:2px 9px; border-radius:20px;}
.ss-pending{background:#eef1f5; color:#5b6675;}
.ss-filling{background:var(--warn-bg); color:var(--warn);}
.ss-crewed{background:var(--ok-bg); color:var(--ok);}
.ss-atrisk{background:var(--bad-bg); color:var(--bad);}

.ed-nudge{display:flex; gap:10px; align-items:flex-start; margin-top:12px; padding:11px 13px; background:var(--warn-bg); border:1px solid var(--warn-line); border-radius:10px; font-size:12.5px; color:#7a4e10; line-height:1.45;}
.ed-nudge-i{flex:none; width:18px; height:18px; border-radius:50%; background:var(--warn); color:#fff; font-weight:700; font-size:12px; display:flex; align-items:center; justify-content:center;}

.ed-section{margin-top:20px;}
.ed-section-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:11px;}
.ed-section-head h3{font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--faint); font-weight:700; display:flex; align-items:baseline; gap:9px;}
.ed-count{text-transform:none; letter-spacing:0; color:var(--muted); font-weight:500; font-size:12px;}

.manifest-head{display:grid; grid-template-columns:1fr 56px 132px 70px; gap:10px; padding:0 12px 6px; font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--faint); font-weight:600;}
.manifest{display:flex; flex-direction:column; gap:5px;}
.mres{display:grid; grid-template-columns:1fr 56px 132px 70px; gap:10px; align-items:center; padding:10px 12px; border:1px solid var(--line); border-radius:9px; background:var(--surface);}
.mres-cancelled{opacity:.55; background:var(--rail);}
.mres-cancelled .mres-cust{text-decoration:line-through;}
.mres-cust{display:flex; align-items:center; gap:7px; font-weight:600; font-size:13.5px; flex-wrap:wrap;}
.mres-pax{text-align:center; font-family:'IBM Plex Mono',monospace; font-size:14px;}
.mres-phone{font-size:12.5px; color:var(--muted);}
.mres-act{text-align:right;}
.mini-x{border:1px solid var(--line); background:var(--surface); color:var(--muted); font-size:11.5px; font-weight:600; padding:4px 9px; border-radius:6px;}
.mini-x:hover{border-color:var(--bad-line); color:var(--bad); background:var(--bad-bg);}
.mini-x.restore:hover{border-color:var(--ok-line); color:var(--ok); background:var(--ok-bg);}
.manifest-foot{margin-top:11px; font-size:11.5px; color:var(--faint); line-height:1.45; text-wrap:pretty;}

/* ---- modal + import ---- */
.modal-scrim{position:fixed; inset:0; background:rgba(15,23,42,.42); backdrop-filter:blur(2px); display:flex; align-items:center; justify-content:center; z-index:50; padding:24px;}
.modal{background:var(--surface); border-radius:14px; width:min(520px,100%); max-height:88vh; overflow:hidden; display:flex; flex-direction:column; box-shadow:0 24px 64px -24px rgba(15,23,42,.5); border:1px solid var(--line);}
.modal-wide{width:min(680px,100%);}
.modal-head{display:flex; align-items:center; justify-content:space-between; padding:18px 20px 14px; border-bottom:1px solid var(--line-soft);}
.modal-head h2{font-size:17px;}
.modal-x{border:0; background:transparent; color:var(--faint); font-size:14px; padding:4px 7px; border-radius:6px;}
.modal-x:hover{background:var(--bg);}
.modal-body{padding:18px 20px; overflow-y:auto;}
.modal-foot{display:flex; justify-content:flex-end; gap:9px; padding:14px 20px; border-top:1px solid var(--line-soft); background:var(--rail);}
.modal-note{font-size:12.5px; color:var(--muted); margin:0 0 14px; line-height:1.5; text-wrap:pretty;}

.file-chip{display:flex; align-items:center; gap:12px; padding:12px 14px; border:1px solid var(--line); border-radius:10px; background:var(--rail);}
.file-ic{font-family:'IBM Plex Mono',monospace; font-size:11px; font-weight:700; color:#fff; background:var(--accent); padding:6px 8px; border-radius:6px;}
.file-meta{flex:1;}
.file-name{font-weight:600; font-size:13.5px;}
.file-rows{font-size:11.5px; color:var(--faint); font-family:'IBM Plex Mono',monospace;}
.file-x{font-size:12px; color:var(--accent); font-weight:600;}

.reconciling{display:flex; align-items:center; gap:11px; padding:24px 4px 8px; color:var(--muted); font-size:13.5px;}
.spinner{width:18px; height:18px; border:2.5px solid var(--line); border-top-color:var(--accent); border-radius:50%; animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

.import-result{display:flex; flex-direction:column; gap:14px;}
.ir-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px;}
.ir-card{border:1px solid var(--line); border-radius:10px; padding:11px 13px; display:flex; flex-direction:column; gap:2px;}
.ir-card b{font-family:'IBM Plex Mono',monospace; font-size:20px; font-weight:600;}
.ir-card span{font-size:11px; color:var(--muted);}
.ir-add{background:var(--ok-bg); border-color:var(--ok-line);} .ir-add b{color:var(--ok);}
.ir-upd{background:var(--cap-bg); border-color:#cfe0ee;} .ir-upd b{color:var(--accent);}
.ir-cancel{background:var(--bad-bg); border-color:var(--bad-line);} .ir-cancel b{color:var(--bad);}
.ir-skip b{color:var(--muted);}
.ir-manual b{color:var(--muted);}

.ir-merge{display:flex; gap:10px; align-items:flex-start; padding:11px 13px; background:var(--warn-bg); border:1px solid var(--warn-line); border-radius:10px; font-size:12.5px; color:#6f4a12; line-height:1.5;}
.ir-merge-i{color:var(--warn); font-size:15px;}
.ir-open-q{color:var(--warn); font-style:italic;}

.ir-unparsed{border:1px solid var(--bad-line); border-radius:10px; overflow:hidden;}
.ir-unparsed-head{display:flex; align-items:center; gap:8px; padding:10px 13px; background:var(--bad-bg); color:var(--bad); font-size:12.5px; font-weight:600;}
.ir-warn-dot{width:8px; height:8px; border-radius:50%; background:var(--bad);}
.ir-badrow{display:flex; align-items:center; gap:10px; padding:9px 13px; border-top:1px solid var(--line-soft); font-size:11.5px;}
.ir-rownum{color:var(--faint); flex:none;}
.ir-raw{flex:1; color:var(--ink); background:var(--rail); padding:3px 7px; border-radius:5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.ir-reason{flex:none; color:var(--bad); font-weight:600;}

.toast{position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; padding:11px 18px; border-radius:10px; font-size:13px; font-weight:500; box-shadow:0 12px 32px -12px rgba(0,0,0,.5); z-index:60; animation:toast-in .2s ease;}
@keyframes toast-in{from{opacity:0; transform:translate(-50%,8px);}}

@media (max-width:1080px){ .panes{grid-template-columns:1fr;} .detail-pane{display:none;} .surface-nav{display:none;} }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="eventdata.jsx"></script>
<script type="text/babel" src="eventlist.jsx"></script>
<script type="text/babel" src="eventdetail.jsx"></script>
<script type="text/babel" src="eventimport.jsx"></script>
<script type="text/babel" src="eventapp.jsx"></script>
</body>
</html>
