<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Muster · Shift Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
:root{
  --accent:#2f5d86;
  --bg:#eef2f6; --surface:#ffffff; --rail:#f7f9fb;
  --ink:#101826; --muted:#5b6675; --faint:#93a0b0;
  --line:#e3e8ee; --line-soft:#eef2f6;
  --ok:#15803d; --ok-bg:#e7f4ec; --ok-line:#cbe6d5;
  --warn:#b45309; --warn-bg:#fbf0db; --warn-line:#f0ddb4;
  --bad:#be2f2a; --bad-bg:#fbe6e4; --bad-line:#f2cdc9;
  --info:#3257a8; --info-bg:#e7ecf7; --info-line:#cdd8ee;
  --cap:#2f5d86; --cap-bg:#e6eef6;
  --mate:#2f7d70; --mate-bg:#e3f1ee;
  --radius:11px;
  --shadow:0 1px 2px rgba(15,23,42,.04), 0 12px 28px -18px rgba(15,23,42,.28);
}
*{box-sizing:border-box;}
html,body{margin:0; height:100%;}
body{font-family:'IBM Plex Sans',system-ui,sans-serif; background:var(--bg); color:var(--ink); font-size:14px; line-height:1.45; -webkit-font-smoothing:antialiased;}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace; font-variant-ligatures:none;}
button{font-family:inherit; cursor:pointer;}
h2,h3{margin:0; font-weight:600;}

/* shell + topbar (shared) */
.shell{height:100vh; display:flex; flex-direction:column; overflow:hidden;}
.topbar{height:52px; flex:none; display:flex; align-items:center; justify-content:space-between; gap:20px; padding:0 18px; background:var(--surface); border-bottom:1px solid var(--line);}
.brand{display:flex; align-items:center; gap:9px; font-size:15px;}
.brand-mark{width:14px; height:14px; border-radius:4px; background:var(--accent); display:inline-block;}
.brand-name{font-weight:700; letter-spacing:-.01em;}
.brand-sep{color:var(--faint); font-weight:400;}
.brand-surface{font-weight:500; color:var(--muted);}
.surface-nav{display:flex; align-items:center; gap:4px; margin-left:auto; margin-right:auto; font-size:13px;}
.surface-nav a{color:var(--muted); text-decoration:none; padding:5px 11px; border-radius:7px; font-weight:500;}
.surface-nav a:hover{background:var(--bg);}
.surface-nav-on{color:var(--ink); font-weight:600; padding:5px 11px; border-radius:7px; background:var(--bg);}
.topbar-r{display:flex; align-items:center; gap:14px; font-size:12.5px;}
.tenant{padding:3px 9px; background:var(--rail); border:1px solid var(--line); border-radius:6px; font-weight:600;}
.today{color:var(--muted);}

.panes{flex:1; display:grid; grid-template-columns:minmax(460px,1fr) minmax(460px,560px); overflow:hidden;}

/* buttons / shared atoms */
.btn{border:1px solid var(--line); background:var(--surface); color:var(--ink); font-weight:600; font-size:13px; padding:8px 14px; border-radius:8px; white-space:nowrap;}
.btn:hover{background:var(--bg);}
.btn-primary{background:var(--accent); border-color:var(--accent); color:#fff;}
.btn-primary:hover{background:color-mix(in oklab,var(--accent) 88%,#000);}
.btn-s{padding:5px 11px; font-size:12px;}
.btn:disabled{opacity:.45; cursor:default;}
.seg{display:inline-flex; border:1px solid var(--line); border-radius:8px; overflow:hidden;}
.seg-b{border:0; background:var(--surface); padding:6px 12px; font-size:12px; font-weight:600; color:var(--muted); border-right:1px solid var(--line);}
.seg-b:last-child{border-right:0;}
.seg-on{background:var(--accent); color:#fff;}

/* shift-state + seat-state badges */
.shift-state{font-size:11px; font-weight:700; padding:2px 9px; border-radius:20px; white-space:nowrap;}
.shift-state.lg{font-size:12.5px; padding:4px 12px;}
.ss-pending{background:#eef1f5; color:#5b6675;}
.ss-filling{background:var(--warn-bg); color:var(--warn);}
.ss-crewed{background:var(--ok-bg); color:var(--ok);}
.ss-atrisk{background:var(--bad-bg); color:var(--bad);}
.seat-state{font-size:10.5px; font-weight:700; padding:2px 8px; border-radius:20px; white-space:nowrap;}
.st-open{background:#eef1f5; color:#7c8696;}
.st-asked{background:var(--info-bg); color:var(--info);}
.st-claimed{background:#ece7f6; color:#6a4fb0;}
.st-confirmed{background:var(--ok-bg); color:var(--ok);}
.st-bailed{background:var(--bad-bg); color:var(--bad);}

.etag{font-size:10px; font-weight:600; padding:2px 7px; border-radius:5px; white-space:nowrap;}
.etag-new{background:var(--info-bg); color:var(--info);}

.boat-dot{width:9px; height:9px; border-radius:50%; display:inline-block; background:var(--faint);}
.boat-dot.lg{width:10px; height:10px;}
[data-boat="mt"]{background:var(--cap);}
[data-boat="tw"]{background:var(--mate);}

/* ---- board (left) ---- */
.board{display:flex; flex-direction:column; overflow:hidden; border-right:1px solid var(--line); background:var(--rail);}
.board-top{flex:none; padding:14px 16px 12px; background:var(--surface); border-bottom:1px solid var(--line);}
.range-row{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:11px;}
.range-pills{display:flex; gap:6px;}
.range-pill{display:flex; flex-direction:column; align-items:flex-start; border:1px solid var(--line); background:var(--surface); color:var(--muted); padding:6px 12px; border-radius:8px; font-size:13px; font-weight:600; line-height:1.2;}
.range-pill:hover{background:var(--bg);}
.range-pill.on{background:var(--ink); color:#fff; border-color:var(--ink);}
.range-sub{font-size:10.5px; font-weight:500; opacity:.65;}
.board-summary{display:flex; align-items:center; gap:12px; font-size:12.5px; color:var(--muted);}
.board-summary b{font-family:'IBM Plex Mono',monospace; color:var(--ink); font-weight:600;}
.bs-sep{width:1px; height:14px; background:var(--line);}
.bs-review{color:var(--warn); font-weight:600;}
.board-mode{margin-left:auto; font-size:11px; color:var(--faint); font-style:italic;}

.board-scroll{flex:1; overflow-y:auto; padding:8px 12px 28px;}
.boat-group{margin-top:10px;}
.boat-group-head{display:flex; align-items:center; gap:8px; padding:6px 4px 8px;}
.boat-group-name{font-size:13px; font-weight:700; white-space:nowrap;}
.boat-group-meta{font-size:11px; color:var(--faint); margin-left:auto; font-family:'IBM Plex Mono',monospace;}

.scard{width:100%; text-align:left; background:var(--surface); border:1px solid var(--line); border-radius:11px; padding:12px 13px; margin-bottom:7px; color:inherit; transition:border-color .12s, box-shadow .12s;}
.scard:hover{border-color:color-mix(in oklab,var(--accent) 40%,var(--line)); box-shadow:var(--shadow);}
.scard-sel{border-color:var(--accent); box-shadow:0 0 0 1px var(--accent), var(--shadow);}
.scard-new{border-left:3px solid var(--info);}
.scard-top{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:9px;}
.scard-day{display:flex; align-items:baseline; gap:8px;}
.scard-dayname{font-weight:700; font-size:14px;}
.scard-date{font-size:11.5px; color:var(--faint);}
.scard-badges{display:flex; align-items:center; gap:7px;}
.lock{font-size:13px; filter:grayscale(.3); opacity:.5;}
.lock-on{opacity:1; filter:none;}

.scard-trips{display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-bottom:10px;}
.trip-chip{display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:500; color:var(--muted); background:var(--rail); border:1px solid var(--line); padding:2px 8px; border-radius:6px;}
.trip-chip b{font-family:'IBM Plex Mono',monospace; color:var(--ink); font-weight:600;}
.scard-pax{font-size:11px; color:var(--faint); margin-left:auto; font-family:'IBM Plex Mono',monospace;}

.scard-bot{display:flex; align-items:center; gap:8px;}
.scard-seats{display:flex; align-items:center; gap:5px;}
.pip{width:18px; height:18px; border-radius:5px; font-size:10px; font-weight:700; display:inline-flex; align-items:center; justify-content:center; color:#fff;}
.pip-open{background:#c2cad6; color:#fff;}
.pip-asked{background:var(--info);}
.pip-claimed{background:#6a4fb0;}
.pip-confirmed{background:var(--ok);}
.pip-bailed{background:var(--bad);}
.pip-super{background:#fff; color:var(--faint); border:1px dashed var(--faint);}
.scard-seats-l{font-size:11px; color:var(--faint); margin-left:3px;}
.scard-nudge{font-size:11px; color:var(--warn); font-weight:600; margin-left:auto;}
.scard-hint{font-size:10.5px; color:var(--faint); margin-left:auto; font-style:italic;}
.board-empty{padding:40px; text-align:center; color:var(--faint);}

/* ---- detail (right) ---- */
.detail-pane{overflow:hidden; background:var(--surface); display:flex;}
.detail-empty{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; color:var(--faint); gap:10px;}
.detail-empty-mark{font-size:30px; opacity:.4;}
.sdetail{flex:1; display:flex; flex-direction:column; overflow:hidden;}
.sd-head{flex:none; padding:18px 22px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:flex-start; gap:16px;}
.sd-eyebrow{display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--muted); font-weight:500; margin-bottom:5px;}
.sd-head h2{font-size:21px; letter-spacing:-.01em;}
.sd-sub{font-size:12.5px; color:var(--faint); margin-top:3px;}

.sd-scroll{flex:1; overflow-y:auto; padding:16px 22px 28px;}
.sd-nudge{display:flex; gap:10px; align-items:flex-start; margin-bottom:14px; padding:11px 13px; background:var(--warn-bg); border:1px solid var(--warn-line); border-radius:10px; font-size:12.5px; color:#6f4a12; line-height:1.45;}
.sd-nudge-i{flex:none; width:20px; height:20px; border-radius:50%; background:var(--warn); color:#fff; font-size:12px; display:flex; align-items:center; justify-content:center;}
.sd-nudge-new{background:var(--info-bg); border-color:var(--info-line); color:#2f4a86;}
.sd-nudge-new .sd-nudge-i{background:var(--info);}

.sd-section{padding:16px 0; border-bottom:1px solid var(--line-soft);}
.sd-section:first-child{padding-top:0;}
.sd-section h3{font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--faint); font-weight:700; margin-bottom:11px;}
.sd-section-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:11px;}
.sd-section-head h3{margin-bottom:0;}
.gate{font-size:11.5px; font-weight:600; color:var(--muted); background:var(--rail); border:1px solid var(--line); padding:3px 10px; border-radius:20px;}
.gate-ok{color:var(--ok); background:var(--ok-bg); border-color:var(--ok-line);}

.trips-list{display:flex; flex-direction:column; gap:5px;}
.trip-row{display:flex; align-items:center; gap:12px; padding:9px 12px; border:1px solid var(--line); border-radius:9px; background:var(--surface); font-size:13px;}
.trip-time{font-weight:600; min-width:78px;}
.trip-pax{font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--muted);}
.trip-pax b{color:var(--ink);}
.trip-res{font-size:12px; color:var(--faint);}
.trip-note{font-size:11.5px; color:var(--warn); margin-left:auto; font-style:italic;}
.pax-note{margin-top:10px; font-size:12px; color:var(--muted); background:var(--rail); border:1px solid var(--line); border-radius:8px; padding:8px 11px;}
.pax-note b{font-family:'IBM Plex Mono',monospace; color:var(--ink);}

.seats{display:flex; flex-direction:column; gap:6px;}
.seatrow{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:10px 12px; border:1px solid var(--line); border-radius:9px; background:var(--surface);}
.seatrow-super{border-style:dashed;}
.seatrow-role{display:flex; align-items:center; gap:10px;}
.role-ic{width:28px; height:28px; border-radius:7px; font-size:12px; font-weight:700; display:flex; align-items:center; justify-content:center; color:#fff; flex:none;}
.role-captain{background:var(--cap);}
.role-mate{background:var(--mate);}
.role-hand{background:#7a6a55;}
.role-super{background:#fff; color:var(--faint); border:1px dashed var(--faint);}
.seatrow-name{font-weight:600; font-size:13.5px; text-transform:capitalize;}
.seatrow-kind{font-size:11px; color:var(--faint);}
.seatrow-fill{display:flex; align-items:center; gap:8px;}
.seatrow-who{font-size:13px; font-weight:500;}
.seatrow-empty{font-size:12.5px; color:var(--faint); font-style:italic;}
.seatrow-reopened{font-size:11px; color:var(--bad); font-weight:600;}
.seatrow-x{border:0; background:transparent; color:var(--faint); font-size:12px; padding:3px 6px; border-radius:5px;}
.seatrow-x:hover{background:var(--bg); color:var(--bad);}
.seat-overrides{display:flex; gap:8px; margin-top:10px;}
.seat-foot{margin-top:11px; font-size:11.5px; color:var(--faint); line-height:1.45; text-wrap:pretty;}

.struct-actions{display:flex; gap:8px;}
.split-panel{border:1px dashed var(--line); border-radius:10px; padding:12px; background:var(--rail);}
.split-h{font-size:12px; color:var(--muted); margin-bottom:10px;}
.split-trip{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:7px;}
.split-trip-l{font-size:13px; font-weight:500;}
.split-actions{display:flex; justify-content:flex-end; gap:8px; margin-top:10px;}

/* lock bar */
.sd-lockbar{flex:none; display:flex; align-items:center; justify-content:space-between; gap:14px; padding:13px 22px; border-top:1px solid var(--line); background:var(--rail);}
.lockbar-info{font-size:12px; color:var(--muted); line-height:1.4;}
.lockbar-info b{color:var(--ink);}

.toast{position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; padding:11px 18px; border-radius:10px; font-size:13px; font-weight:500; box-shadow:0 12px 32px -12px rgba(0,0,0,.5); z-index:60; animation:toast-in .2s ease; max-width:560px; text-align:center;}
@keyframes toast-in{from{opacity:0; transform:translate(-50%,8px);}}

@media (max-width:1080px){ .panes{grid-template-columns:1fr;} .detail-pane{display:none;} .surface-nav{display:none;} }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="shiftdata.jsx"></script>
<script type="text/babel" src="shiftboard.jsx"></script>
<script type="text/babel" src="shiftdetail.jsx"></script>
<script type="text/babel" src="shiftapp.jsx"></script>
</body>
</html>
