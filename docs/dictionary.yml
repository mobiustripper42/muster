# The dictionary. Three keys per entry, no others.
#
#   term  the canonical name. Unique across the file.
#   says  plain English, max 160 characters. May not lean on an unregistered term —
#         definitions bottom out in ordinary English or they do not pass.
#   not   forbidden alternates. Using one fails the build, naming the canonical term.
#
# `docs/DICTIONARY.md` is generated from this file by `npm run gen:dictionary`. This is the
# source; the markdown is what a person reads. Never edit the markdown.
#
# The gate reads `docs/SPEC.md`, `docs/decisions/*.md` and `CLAUDE.md`. Not code, not commit
# messages, not session logs, not the worksheets. Vocabulary already in those files on the day
# this shipped is grandfathered (`docs/dictionary-baseline.txt`) — registration is always
# welcome, but the backlog is not required to register.

# ── Payments ────────────────────────────────────────────────────────────────────
#
# Registered ahead of use. Every one of these appeared in DEC-107 and none survives in the
# corpus today — the record was tombstoned and then rewritten to 1,388 bytes. They are here
# because the reservations rewrites will need them back, and a term registered before it is
# written is a term nobody has to argue about afterwards.

- term: SAQ-A
  says: the lightest card-industry compliance tier, which applies because card numbers never reach our servers
  not: []

- term: 3DS
  says: the bank's extra check at checkout, where the customer confirms the payment in their banking app or by a texted code
  not: []

- term: SCA
  says: a European rule requiring that extra bank check on most card payments
  not: []

- term: bps
  says: hundredths of a percent, so 800 bps is 8 percent — used for rates so nothing has to store a fraction
  not: [basis points]

- term: off-session
  says: charging a saved card when the customer is not at the keyboard, so nobody is there to answer a decline
  not: []

- term: idempotency key
  says: a label sent with a charge so that repeating the same request does the same thing once, instead of charging twice
  not: []

- term: Payment Element
  says: Stripe's card form, embedded in our own page, so the customer never leaves the site to pay
  not: [Stripe Elements, inline Elements]

- term: residual race
  says: two customers pay for the last boat at the same moment; one wins, and the other has to be refunded and told
  not: []

# ── Boats and crew ──────────────────────────────────────────────────────────────
#
# These have real usage across the corpus, so their `not` alternates are the live drift test.

- term: MMC
  says: the Coast Guard credential a captain must hold and keep current — on BrewBoat's boats a mate does not need one
  not: []

- term: COI
  says: the Coast Guard inspection certificate that sets a boat's legal passenger limit and the crew it must carry
  not: []

# `not` is deliberately EMPTY, and that is the whole story of this entry. `manning` is the field
# name, the database column, and the word in nine places in SPEC.md plus a dozen decision records —
# several of them frozen in `docs/decisions-baseline.txt` and so uneditable. Registering it as a
# forbidden alternate lights up 49 existing uses that cannot all be fixed, and the dictionary
# baseline is generated once by design rather than refreshed to absorb them.
#
# So this entry does the job it was asked to do — say what the thing IS, because "manning" reads
# like a passenger count and is not one — without pretending the codebase has been renamed. Add
# `manning` to `not` on the day it actually is.
- term: required crew
  says: the crew a boat must carry to sail — a list of roles and how many of each, not a number of passengers. That is the COI limit
  not: []

# ── Mechanism ───────────────────────────────────────────────────────────────────

- term: CAS
  says: write a row only if it still holds the value you read, so two people racing for the same seat cannot both win
  not: [compare-and-swap]

- term: RLS
  says: a database feature that filters rows per signed-in user. Muster does not use it — who may see what is decided in the service layer
  not: []

# ── The thing being sold ────────────────────────────────────────────────────────
#
# `trip` rather than `departure`: a departure is when something leaves, not the thing that leaves,
# and the corpus was using the word for both. Neither alternate can be forbidden. `slot` is the
# code's word (`slotIdentity`, `VirtualSlot`, `writeSlotBooking`) AND means a workflow slot in
# `CLAUDE.md:38` — a different word entirely, in a file this repo does not own. `departure` reads
# correctly in its own sense ("the 13:30 departure") and forbidding it would fail 109 lines.
#
# So the code's name goes INSIDE the definition instead. The gate reads prose, never code, so a
# rename it cannot enforce is better stated than pretended.

- term: trip
  says: one boat leaving at one time on one day — what a customer buys and crew sail. The code calls it a slot.
  not: []

# ── Durations ───────────────────────────────────────────────────────────────────
#
# Three numbers, two of them stored, and the whole reason §2.8 measured occupancy with the wrong
# one. Registered together so the distinction survives the next person to write "trip length".
#
# They compose: hold minutes = trip time + turnaround.

- term: hold minutes
  says: the whole time a boat is committed to one trip — on the water, then back at the dock ready for the next
  not: [hold time, lock time, occupied minutes]

- term: trip time
  says: how long the customer is actually on the water, always less than the hold minutes for that trip
  not: []

- term: turnaround
  says: the boat sitting at the dock between trips, cleaned and made ready; hold minutes minus trip time
  not: []

# A FOURTH duration, and the one that collides. `CHECKOUT_HOLD_MINUTES` (`claim.ts:36`) is this
# window — but `hold minutes` above is a different quantity entirely, and both spell out as
# "hold ... minutes". The constant is code, so `check:dictionary` can never see the collision;
# naming the code term in `says` is the only place it gets written down.

- term: payment window
  says: how long a checkout holds the boat before the customer loses it and it goes back on sale. The code calls it the checkout hold.
  not: []

# A pending reservation past its window. Computed from the reserved time on every read, never
# stored (§2.8.1) — which is why there is no `expired` status to register. `expired` stays
# usable in prose for the window itself ("after the window expired"), so it is not forbidden.

- term: lapsed
  says: a pending reservation whose payment window has run out — worked out from the clock every time, never written down
  not: []

# ── What the operator's calendar draws ──────────────────────────────────────────
#
# Five slot states, fixed in §2.10.2 (task 14.1). Registered because `sold` and `busy` are
# different questions — who bought this slot, and which trip is using the boat — and the
# corpus was using "booked" and "unavailable" for both. The code's names go inside `says`,
# same as `trip`: the gate reads prose, and `availability.ts` is renamed when 14.9 touches it.

- term: open
  says: a slot that is for sale; nothing is written for it
  not: []

- term: sold
  says: a slot somebody bought — a booked reservation on it. The code calls the slot booked.
  not: []

- term: held
  says: a slot somebody is at the checkout for — a live pending reservation on it
  not: []

- term: busy
  says: a slot nobody bought, on a boat that is out on another trip overlapping it. The code calls it unavailable.
  not: [unavailable]

- term: blocked
  says: a slot an operator block covers
  not: []

# ── The frozen quote ────────────────────────────────────────────────────────────
#
# Registered ahead of the issue #812 build, same reason as the payments block above: a term
# registered before it is written is a term nobody has to argue about afterwards. "Invoice" already
# means a bill-to-be-paid elsewhere in the corpus (FUTURE_IDEAS' Xola balance modes), so the
# qualifier is load-bearing rather than decorative.

- term: booking invoice
  says: the frozen record of what a customer was quoted — every charged component and the rate behind it, kept on the booking and never recomputed
  not: []
